name: Refresh league data

# Pulls ESPN fantasy league 45839 where the fantasy API is reachable and
# commits app/src/league/league.json back to the branch it ran on. The
# fetch is stdlib-only Python, so no dependency install is needed.
#
# `mode: probe` just dumps the API response shapes to the log without
# committing anything — used to develop the fetch script from a sandbox
# that can't reach ESPN directly.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (dump API shapes) or build (write league.json)"
        required: false
        default: "build"
  # Registers the workflow off-main and refreshes data whenever the fetch
  # script changes on this branch. The data commit it pushes touches only
  # league.json, which is outside `paths`, so no run loop.
  push:
    branches: [claude/espn-fantasy-baseball-viz-k8zj6m]
    paths:
      - data/fetch_espn_league.py
      - .github/workflows/league-data.yml

permissions:
  contents: write

concurrency:
  group: league-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      SWID: ${{ secrets.SWID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Probe
        if: ${{ github.event_name == 'push' || inputs.mode == 'probe' }}
        continue-on-error: true
        run: python3 data/fetch_espn_league.py probe

      - name: Build
        id: build
        if: ${{ github.event_name == 'push' || (inputs.mode || 'build') == 'build' }}
        run: python3 data/fetch_espn_league.py build

      - name: Commit data
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/league/league.json
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "Refresh league data"
            # the branch may have moved while the fetch ran
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
